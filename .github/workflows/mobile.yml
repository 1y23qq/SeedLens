name: Mobile
on:
  push:
    branches: [mobile]
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        type: choice
        default: all
        options: [all, device, simulator]
      simulator_runner:
        description: Simulator host
        type: choice
        default: macos-15
        options: [macos-15, macos-15-intel]
      simulator_artifact_run:
        description: Optional simulator-app artifact run to reuse
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios-device:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'simulator'
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build iPhone and iPad application
        run: |
          cmake -S mobile -B build-mobile/ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          cmake --build build-mobile/ios --config Release --target SeedLens --parallel 3
          file build-mobile/ios/Release-iphoneos/SeedLens.app/SeedLens
          otool -L build-mobile/ios/Release-iphoneos/SeedLens.app/SeedLens
          mkdir -p dist/Payload
          cp -R build-mobile/ios/Release-iphoneos/SeedLens.app dist/Payload/
          cd dist && zip -qr SeedLens-unsigned.ipa Payload && rm -rf Payload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SeedLens-iOS-device
          path: dist/*.ipa
  ios-simulator:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'device'
    runs-on: ${{ inputs.simulator_runner || 'macos-15' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Warm simulator services
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(v["udid"] for a in d["devices"].values() for v in a if v["name"].startswith("iPhone")))')
          echo "IOS_TEST_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          open -a Simulator
          xcrun simctl boot "$DEVICE" || true
      - name: Build iOS simulator application
        if: inputs.simulator_artifact_run == ''
        run: |
          cmake -S mobile -B build-mobile/ios-sim -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES="$(uname -m)" -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          cmake --build build-mobile/ios-sim --config Release --target SeedLens --parallel 3
          mkdir -p dist
          ditto -c -k --keepParent build-mobile/ios-sim/Release-iphonesimulator/SeedLens.app dist/SeedLens-simulator.zip
      - name: Reuse simulator application
        if: inputs.simulator_artifact_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.simulator_artifact_run }}
        run: |
          gh run download "$ARTIFACT_RUN" --repo "$GITHUB_REPOSITORY" --name SeedLens-iOS-simulator-app --dir build-mobile/prebuilt
          mkdir -p build-mobile/ios-sim/Release-iphonesimulator dist
          ditto -x -k build-mobile/prebuilt/SeedLens-simulator.zip build-mobile/ios-sim/Release-iphonesimulator
          cp build-mobile/prebuilt/SeedLens-simulator.zip dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SeedLens-iOS-simulator-app
          path: dist/SeedLens-simulator.zip
      - name: Verify native engine and capture iPhone
        run: |
          sim() { python3 -c 'import subprocess,sys;subprocess.run(["xcrun","simctl",*sys.argv[1:]],check=True,timeout=180)' "$@"; }
          DEVICE="$IOS_TEST_DEVICE"
          sim bootstatus "$DEVICE" -b
          sim install "$DEVICE" build-mobile/ios-sim/Release-iphonesimulator/SeedLens.app
          sim launch "$DEVICE" com.seedlens.app --self-test
          DATA=$(sim get_app_container "$DEVICE" com.seedlens.app data)
          python3 -c 'import pathlib,sys,time;root=pathlib.Path(sys.argv[1]);end=time.monotonic()+90
          while not list(root.rglob("self-test.json")):
              if time.monotonic()>end:raise RuntimeError("Native self-test report did not appear")
              time.sleep(1)' "$DATA"
          REPORT=$(find "$DATA" -name self-test.json -print -quit)
          python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d);assert d["ok"]' "$REPORT"
          sim launch "$DEVICE" com.seedlens.app
          sleep 10
          mkdir -p dist
          sim io "$DEVICE" screenshot dist/ios-phone.png
          for SCENE in nether end; do
            sim terminate "$DEVICE" com.seedlens.app
            sim launch "$DEVICE" com.seedlens.app --scene "$SCENE"
            sleep 5
            sim io "$DEVICE" screenshot "dist/ios-$SCENE.png"
          done
          sim terminate "$DEVICE" com.seedlens.app
          sim launch "$DEVICE" com.seedlens.app --export-smoke
          sleep 30
          sim io "$DEVICE" screenshot dist/ios-export-picker.png
          MAP="$DATA/Documents/Exports/SeedLens-test.png"
          test -f "$MAP"
          cp "$MAP" dist/ios-exported-map.png
          cp "$REPORT" dist/ios-core-report.json
          sim shutdown "$DEVICE"
          TABLET=$(sim list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(v["udid"] for a in d["devices"].values() for v in a if v["name"].startswith("iPad")))')
          sim boot "$TABLET"
          sim bootstatus "$TABLET" -b
          sim install "$TABLET" build-mobile/ios-sim/Release-iphonesimulator/SeedLens.app
          sim launch "$TABLET" com.seedlens.app
          sleep 10
          sim io "$TABLET" screenshot dist/ios-tablet.png
          sim terminate "$TABLET" com.seedlens.app
          sim launch "$TABLET" com.seedlens.app --export-smoke
          sleep 30
          sim io "$TABLET" screenshot dist/ios-tablet-share.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: SeedLens-iOS-simulator
          path: |
            dist/*.png
            dist/*-report.json
            dist/ios-export-log.txt
