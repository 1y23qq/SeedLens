name: Mobile
on:
  push:
    branches: [mobile]
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        type: choice
        default: all
        options: [all, device, simulator]
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios-device:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'simulator'
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build iPhone and iPad application
        run: |
          cmake -S mobile -B build-mobile/ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          cmake --build build-mobile/ios --config Release --target SeedLens --parallel 3
          file build-mobile/ios/Release-iphoneos/SeedLens.app/SeedLens
          otool -L build-mobile/ios/Release-iphoneos/SeedLens.app/SeedLens
          mkdir -p dist/Payload
          cp -R build-mobile/ios/Release-iphoneos/SeedLens.app dist/Payload/
          cd dist && zip -qr SeedLens-unsigned.ipa Payload && rm -rf Payload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SeedLens-iOS-device
          path: dist/*.ipa
  ios-simulator:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'device'
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build iOS simulator application
        run: |
          cmake -S mobile -B build-mobile/ios-sim -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES="$(uname -m)" -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          cmake --build build-mobile/ios-sim --config Release --target SeedLens --parallel 3
      - name: Verify native engine and capture iPhone
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(v["udid"] for a in d["devices"].values() for v in a if v["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-mobile/ios-sim/Release-iphonesimulator/SeedLens.app
          xcrun simctl launch --console "$DEVICE" com.seedlens.app --self-test
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.seedlens.app data)
          REPORT=$(find "$DATA" -name self-test.json -print -quit)
          python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d);assert d["ok"]' "$REPORT"
          xcrun simctl launch "$DEVICE" com.seedlens.app
          sleep 10
          mkdir -p dist
          xcrun simctl io "$DEVICE" screenshot dist/ios-phone.png
          for SCENE in nether end; do
            xcrun simctl terminate "$DEVICE" com.seedlens.app
            xcrun simctl launch "$DEVICE" com.seedlens.app --scene "$SCENE"
            sleep 5
            xcrun simctl io "$DEVICE" screenshot "dist/ios-$SCENE.png"
          done
          xcrun simctl terminate "$DEVICE" com.seedlens.app
          xcrun simctl launch "$DEVICE" com.seedlens.app --export-smoke
          sleep 30
          xcrun simctl io "$DEVICE" screenshot dist/ios-export-picker.png
          MAP="$DATA/Documents/Exports/SeedLens-test.png"
          test -f "$MAP"
          cp "$MAP" dist/ios-exported-map.png
          xcrun simctl spawn "$DEVICE" log show --last 2m --style compact --predicate 'process == "SeedLens"' > dist/ios-export-log.txt
          cp "$REPORT" dist/ios-core-report.json
          xcrun simctl shutdown "$DEVICE"
          TABLET=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(v["udid"] for a in d["devices"].values() for v in a if v["name"].startswith("iPad")))')
          xcrun simctl boot "$TABLET"
          xcrun simctl bootstatus "$TABLET" -b
          xcrun simctl install "$TABLET" build-mobile/ios-sim/Release-iphonesimulator/SeedLens.app
          xcrun simctl launch "$TABLET" com.seedlens.app
          sleep 10
          xcrun simctl io "$TABLET" screenshot dist/ios-tablet.png
          xcrun simctl terminate "$TABLET" com.seedlens.app
          xcrun simctl launch "$TABLET" com.seedlens.app --export-smoke
          sleep 30
          xcrun simctl io "$TABLET" screenshot dist/ios-tablet-share.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: SeedLens-iOS-simulator
          path: |
            dist/*.png
            dist/*-report.json
            dist/ios-export-log.txt
